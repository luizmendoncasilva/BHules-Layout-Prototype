name: Pipeline (Merge)

on:
  push:
    branches: [main]

jobs:
  ci:
    permissions:
      id-token: write
      contents: read
    uses: BHubAI/shared-workflows/.github/workflows/ci-node.yml@main
    with:
      NodeVersion: '20'
      NodePackageManager: 'npm'
      IsAwsCodeArtifact: false
      AccountId: '316524324729'
      Role: 'GithubActionsRole'
      HasFrontEndIntegrationTests: false
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs:
      - ci
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          HUSKY: 0

      - name: Configure git user
        run: |
          git config user.name "bhub-data-team-service-account"
          git config user.email "bhub-data-team-service-account@users.noreply.github.com"

      - name: Build library
        run: npm run build

      # release automática
      - name: Semantic Release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          NPM_CONFIG_USERCONFIG: .npmrc.publish
          HUSKY: 0
  
  publish-storybook:
    name: Publish Storybook
    runs-on: ubuntu-latest
    needs:
      - release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
