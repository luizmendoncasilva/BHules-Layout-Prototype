name: Pipeline (Publish Test Version)

on:
  workflow_dispatch:

jobs:
  publish-test-package:
    name: Publish GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set prerelease version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version.replace(/-.*/, '')")
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          NEW_VERSION="${BASE_VERSION}-snapshot.${TIMESTAMP}"
          echo "Publishing version: $NEW_VERSION"
          npm version $NEW_VERSION --no-git-tag-version

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --userconfig .npmrc.publish --registry=https://npm.pkg.github.com/ --tag snapshot
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
